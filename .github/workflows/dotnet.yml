name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - name: Restore, build and test
        run: |
          dotnet restore SSO-Auth.sln
          dotnet build SSO-Auth.sln -c Release --no-restore
          dotnet test SSO-Auth.sln -c Release --no-build --verbosity normal
